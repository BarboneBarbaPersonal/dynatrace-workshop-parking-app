<!doctype html>
<!-- Screen 4: My reservations. View your own reservations, open one to check in, or cancel. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My reservations - Garage Parking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone"><main id="list"></main></div>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script>
    const db = UI.driver('My reservations');
    function render() {
      const mine = Store.reservationsOf(db, db.currentDriver);
      document.getElementById('list').innerHTML = mine.length ? mine.map((r) =>
        `<div class="card res"><a class="num" href="confirmed.html?id=${r.id}">${r.spotId}</a>
          <a class="info" href="confirmed.html?id=${r.id}">${Store.TYPES[r.type].label} · ${UI.day(r.start)} · All day<br>
          <span class="pill ${r.status}">${UI.LABELS[r.status]}</span></a>
          ${r.status === 'reserved' ? `<button class="link-danger" type="button" data-cancel="${r.id}">Cancel</button>` : ''}</div>`).join('')
        : '<p class="muted">No reservations yet. <a href="find.html">Find a spot</a></p>';
    }
    document.getElementById('list').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cancel]');
      if (b) { Store.cancel(db, Number(b.dataset.cancel), db.currentDriver); render(); }
    });
    if (db) render(); // no db = nobody signed in, the page is already going to sign-in
  </script>
</body>
</html>
